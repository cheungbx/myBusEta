        col2: ["06:30", "06:50", "07:10", "07:30", "07:50", "08:10", "08:30", "08:50", "09:10", "09:30", "09:50", "10:10", "10:30", "10:50", "11:10", "11:30", "11:50", "12:10", "12:30", "12:50", "13:30", "14:50", "15:30", "15:50", "16:10", "16:30", "16:50", "17:10", "17:30", "17:50", "18:10", "18:30", "18:50", "19:10", "19:30"],
        col3: ["06:50", "07:35", "08:20", "09:05", "09:50", "10:35", "11:20", "12:05", "12:50", "14:50", "15:35", "16:20", "17:05", "17:50", "18:35", "19:20"]
    },
    'TsuenWantoOceanPointe.jpg': {
        col1: ["06:45", "07:05", "07:25", "07:45", "08:05", "08:25", "08:45", "09:05", "09:25", "09:45", "10:05", "10:25", "10:45", "11:05", "11:25", "11:45", "12:05", "12:25", "12:45", "13:05", "13:45", "15:05", "15:45", "16:05", "16:25", "16:45", "17:05", "17:25", "17:45", "18:05", "18:25", "18:45", "19:05", "19:25", "19:45", "20:05"],
        col2: ["06:45", "07:05", "07:25", "07:45", "08:05", "08:25", "08:45", "09:05", "09:25", "09:45", "10:05", "10:25", "10:45", "11:05", "11:25", "11:45", "12:05", "12:25", "12:45", "13:05", "13:45", "15:05", "15:45", "16:05", "16:25", "16:45", "17:05", "17:25", "17:45", "18:05", "18:25", "18:45", "19:05", "19:25", "19:45"],

    }

// Dynamic Government Public Holidays for 2026 (sourced from official GovHK list)
const hkPublicHolidays2026 = [
    "2026-01-01", "2026-02-17", "2026-02-18", "2026-02-19", 
    "2026-04-03", "2026-04-04", "2026-04-06", "2026-04-07", 
    "2026-05-01", "2026-05-25", "2026-06-19", "2026-07-01", 
    "2026-09-26", "2026-10-01", "2026-10-19", "2026-12-25", "2026-12-26"
];

function getHongKongDate() {
    const now = new Date();
    const options = { timeZone: 'Asia/Hong_Kong', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    const formatter = new Intl.DateTimeFormat('en-CA', options);
    const parts = formatter.formatToParts(now);
    let obj = {};
    parts.forEach(p => obj[p.type] = p.value);
    return {
        dateStr: `${obj.year}-${obj.month}-${obj.day}`,
        timeStr: `${obj.hour}:${obj.minute}:${obj.second}`,
        displayDate: `${obj.day}-${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(obj.month)-1]}-${obj.year}`,
        displayTime: `${obj.hour}:${obj.minute}:${obj.second}`,
        dayOfWeek: new Date(now.toLocaleString("en-US", {timeZone: "Asia/Hong_Kong"})).getDay(),
        epochMinutes: parseInt(obj.hour) * 60 + parseInt(obj.minute),
        fullDateObj: new Date(`${obj.year}-${obj.month}-${obj.day}T${obj.hour}:${obj.min || obj.minute}:${obj.second}+08:00`)
    };
}

function determineScheduleColumn(hkDate) {
    if (hkDate.dayOfWeek === 0 || hkPublicHolidays2026.includes(hkDate.dateStr)) {
        return 'col3';
    } else if (hkDate.dayOfWeek === 6) {
        return 'col2';
    }
    return 'col1';
}

function getEtaColorClass(mins) {
    if (mins < 9) return 'eta-red';
    if (mins < 15) return 'eta-orange';
    return 'eta-green';
}

function calculateEstateEtas(filename, hkDate) {
    const schedCol = determineScheduleColumn(hkDate);
    const scheduleTimes = estateSchedules[filename]?.[schedCol] || [];
    const currentMins = hkDate.epochMinutes;

    let etas = [];
    for (let timeStr of scheduleTimes) {
        let [hh, mm] = timeStr.split(':').map(Number);
        let schedMins = hh * 60 + mm;
        if (schedMins >= currentMins) {
            etas.push(schedMins - currentMins);
            if (etas.length === 3) break;
        }
    }
    return etas;
}

async function fetchApiEtas(url) {
    try {
        const response = await fetch(url);
        if (!response.ok) return [];
        const data = await response.json();
        
        let etaEntries = [];
        if (data.data && Array.isArray(data.data)) {
            etaEntries = data.data;
        } else if (Array.isArray(data)) {
            etaEntries = data;
        } else if (data.data && data.data.eta) {
            etaEntries = data.data.eta;
        }

        let etas = [];
        const now = new Date();
        
        for (let item of etaEntries) {
            let etaTimeStr = item.eta || item.ograf_eta || item.timestamp;
            if (!etaTimeStr) continue;

            let etaDate = new Date(etaTimeStr);
            if (isNaN(etaDate.getTime())) continue;

            let diffMins = Math.round((etaDate - now) / 60000);
            if (diffMins >= 0) {
                etas.push(diffMins);
            }
            if (etas.length === 3) break;
        }
        return etas;
    } catch (e) {
        return [];
    }
}

async function updateBusBoard() {
    const hkDate = getHongKongDate();
    document.getElementById('pageHeader').innerText = `縉皇居交通 ${hkDate.displayDate} ${hkDate.displayTime}`;

    let tbodyHtml = '';

    for (let item of busInstructions) {
        let etas = [];
        if (item.type === 'file') {
            etas = calculateEstateEtas(item.src, hkDate);
        } else {
            etas = await fetchApiEtas(item.src);
        }

        if (etas.length === 0) {
            continue;
        }

        let etaHtml = '';
        for (let m of etas) {
            let colorClass = getEtaColorClass(m);
            etaHtml += `<span class="eta-badge ${colorClass}">${m}</span>`;
        }

        tbodyHtml += `
            <tr>
                <td class="col-dir">${item.dir}</td>
                <td class="col-route"><span class="route-badge">${item.route}</span></td>
                <td class="col-stop">${item.stop}</td>
                <td class="col-eta">${etaHtml}</td>
            </tr>
        `;
    }

    if (tbodyHtml === '') {
        tbodyHtml = `<tr><td colspan="4" class="no-service" style="text-align:center; padding: 20px;">今日所有班次已結束</td></tr>`;
    }

    document.getElementById('etaTableBody').innerHTML = tbodyHtml;
}

updateBusBoard();
setInterval(updateBusBoard, 10000);
