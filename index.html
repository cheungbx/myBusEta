<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>縉皇居交通</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-6">
            <h1 class="text-2xl font-bold text-red-600" id="clock">縉皇居交通 --:--:--</h1>
        </header>

        <div class="bg-white shadow rounded-lg overflow-hidden">
            <table class="w-full text-left border-collapse text-sm md:text-base">
                <thead class="bg-gray-100 text-gray-700">
                    <tr>
                        <th class="p-3">類別</th>
                        <th class="p-3">開往</th>
                        <th class="p-3">路線</th>
                        <th class="p-3">發車站</th>
                        <th class="p-3">ETA (分)</th>
                    </tr>
                </thead>
                <tbody id="bus-table-body">
                    <tr><td colspan="5" class="p-4 text-center">載入中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const schedules = {
            "OceanPointeToTsuenWan": {
                monFri: ["06:30", "06:50", "07:10", "07:20", "07:30", "07:40", "07:50", "08:00", "08:10", "08:20", "08:30", "08:50", "09:10", "09:30", "09:50", "10:10", "10:30", "10:50", "11:10", "11:30", "11:50", "12:10", "12:30", "12:50", "13:30", "14:50", "15:30", "15:50", "16:10", "16:30", "16:50", "17:10", "17:30", "17:50", "18:10", "18:30", "18:50", "19:10", "19:30", "19:50"],
                sat: ["06:30", "06:50", "07:10", "07:30", "07:50", "08:10", "08:30", "08:50", "09:10", "09:30", "09:50", "10:10", "10:30", "10:50", "11:10", "11:30", "11:50", "12:10", "12:30", "12:50", "13:30", "14:50", "15:30", "15:50", "16:10", "16:30", "16:50", "17:10", "17:30", "17:50", "18:10", "18:30", "18:50", "19:10", "19:30"],
                sunHol: ["06:50", "07:35", "08:20", "09:05", "09:50", "10:35", "11:20", "12:05", "12:50", "14:50", "15:35", "16:20", "17:05", "17:50", "18:35", "19:20"]
            },
            "TsuenWantoOceanPointe": {
                monFri: ["06:45", "07:05", "07:25", "07:45", "08:05", "08:25", "08:45", "09:05", "09:25", "09:45", "10:05", "10:25", "10:45", "11:05", "11:25", "11:45", "12:05", "12:25", "12:45", "13:05", "13:45", "15:05", "15:45", "16:05", "16:25", "16:45", "17:05", "17:25", "17:45", "18:05", "18:25", "18:45", "19:05", "19:25", "19:45", "20:05"],
                sat: ["06:45", "07:05", "07:25", "07:45", "08:05", "08:25", "08:45", "09:05", "09:25", "09:45", "10:05", "10:25", "10:45", "11:05", "11:25", "11:45", "12:05", "12:25", "12:45", "13:05", "13:45", "15:05", "15:45", "16:05", "16:25", "16:45", "17:05", "17:25", "17:45", "18:05", "18:25", "18:45", "19:05", "19:25", "19:45"],
                sunHol: ["07:05", "07:50", "08:35", "09:20", "10:05", "10:50", "11:35", "12:20", "13:05", "15:05", "15:50", "16:35", "17:20", "18:05", "18:50", "19:35"]
            }
        };

        const busRoutes = [
            { id: '屋苑', dir: '荃灣', route: '邨巴', from: '縉皇居', api: 'OceanPointeToTsuenWan' },
            { id: '屋苑', dir: '縉皇居', route: '邨巴', from: '荃灣', api: 'TsuenWantoOceanPointe' },
            { id: 'KMB', dir: '荃灣', route: '234A', from: '海韻花園', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234A/1' },
            { id: 'KMB', dir: '荃灣', route: '234B', from: '海韻花園', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234B/1' },
            { id: 'KMB', dir: '荃灣', route: '53', from: '海韻花園', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/53/1' },
            { id: 'KMB', dir: '觀塘', route: '234C', from: '海韻花園', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234C/1' },
            { id: 'KMB', dir: '觀塘', route: '234D', from: '海韻花園', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234D/1' },
            { id: 'KMB', dir: '九龍站', route: '261B', from: '海韻花園', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/261B/1' },
            { id: 'KMB', dir: '火炭', route: '48P', from: '海韻花園', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/48P/1' },
            { id: 'KMB', dir: '旺角', route: '52P', from: '海韻花園', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52P/1' },
            { id: 'GMB', dir: '荃灣', route: '96C', from: '碧堤半島', api: 'https://data.etagmb.gov.hk/eta/route-stop/2008093/2/1' },
            { id: 'KMB', dir: '旺角', route: '52X', from: '海韻花園', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52X/1' },
            { id: 'CTB', dir: '銅鑼灣', route: '952', from: '海韻花園', api: 'https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/002618/952' },
            { id: 'KMB', dir: '機場', route: 'A38', from: '深井深慈街', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/5A2A66038B409879/A38/1' },
            { id: 'KMB', dir: '屯門', route: '52X', from: '碧堤半島', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/52X/1' },
            { id: 'KMB', dir: '元朗', route: '53', from: '碧堤半島', api: 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/53/1' },
            { id: 'CTB', dir: '屯門', route: '952', from: '碧堤半島', api: 'https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/002619/952' }
        ];

        let isTodayHoliday = false;

        async function checkHoliday() {
            try {
                const year = new Date().getFullYear();
                const response = await fetch(`https://www.1823.gov.hk/common/ical/en.json`);
                const data = await response.json();
                const today = new Date().toISOString().split('T')[0].replace(/-/g, '');
                isTodayHoliday = data.vcalendar[0].vevent.some(e => e['dtstart;value=date'] === today);
            } catch (e) { isTodayHoliday = false; }
        }

        function updateClock() {
            const now = new Date();
            const hkTime = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Hong_Kong',
                day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            }).format(now);
            document.getElementById('clock').innerText = `縉皇居交通 ${hkTime}`;
        }

        async function getStaticETA(bus) {
            const now = new Date();
            const day = now.getDay();
            let key = (day === 0 || isTodayHoliday) ? 'sunHol' : (day === 6 ? 'sat' : 'monFri');
            const sched = schedules[bus.api][key];
            const currentHM = now.getHours() * 60 + now.getMinutes();
            const nextBuses = sched.filter(t => {
                const [h, m] = t.split(':').map(Number);
                return (h * 60 + m) >= currentHM;
            }).slice(0, 3);
            
            if (nextBuses.length === 0) return null;
            return nextBuses.map(t => {
                const [h, m] = t.split(':').map(Number);
                return (h * 60 + m) - currentHM;
            });
        }

        async function fetchAPI(bus) {
            try {
                const res = await fetch(bus.api);
                const data = await res.json();
                const items = data.data || [];
                const now = new Date();
                const etas = items.map(i => {
                    if (!i.eta) return null;
                    const etaTime = new Date(i.eta);
                    const diff = Math.round((etaTime - now) / 60000);
                    return diff < 0 ? 0 : diff;
                }).filter(v => v !== null).slice(0, 3);
                
                return etas.length > 0 ? etas : null;
            } catch { return null; }
        }

        async function refreshData() {
            const tbody = document.getElementById('bus-table-body');
            tbody.innerHTML = '';
            for (const bus of busRoutes) {
                const etas = bus.api.startsWith('http') ? await fetchAPI(bus) : await getStaticETA(bus);
                if (!etas || etas.length === 0) continue;
                const row = `
                    <tr class="border-t hover:bg-gray-50">
                        <td class="p-3 font-medium text-gray-500">${bus.id}</td>
                        <td class="p-3 text-sm">${bus.dir}</td>
                        <td class="p-3 font-bold">${bus.route}</td>
                        <td class="p-3 text-sm">${bus.from}</td>
                        <td class="p-3 text-red-600 font-mono font-bold">${etas.join(' ')}</td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            }
        }

        setInterval(() => {
            updateClock();
        }, 1000);

        setInterval(() => {
            refreshData();
        }, 10000);

        (async () => {
            await checkHoliday();
            updateClock();
            refreshData();
        })();
    </script>
</body>
</html>
