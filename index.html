<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Point Bus ETA Schedule</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 20px;
        }
        h2 {
            margin-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #004080;
            color: white;
        }
        .route-badge {
            background-color: #0066cc;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
        }
        .eta-badge {
            padding: 4px 8px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            margin-right: 5px;
            display: inline-block;
            min-width: 30px;
            text-align: center;
        }
        .eta-red { background-color: #d9534f; }     /* < 9 mins */
        .eta-orange { background-color: #f0ad4e; }  /* 9 - 14 mins */
        .eta-green { background-color: #5cb85c; }   /* >= 15 mins */
        .eta-none { background-color: #777; }       /* No ETA / Ended */
    </style>
</head>
<body>

    <h2 id="page-title">縉皇居交通</h2>
    <div id="current-time" style="font-weight: bold; margin-bottom: 15px;"></div>

    <table>
        <thead>
            <tr>
                <th>開往</th>
                <th>路線</th>
                <th>發車站</th>
                <th>到站時間(分鐘)</th>
            </tr>
        <thead id="eta-table-body">
        </thead>
    </table>

    <canvas id="image-canvas" style="display:none;"></canvas>

<script>
    // Global public holidays cache for the current year
    let publicHolidays = new Set();

    // Raw configuration instructions list
    const busInstructions = [
        "屋苑 邨巴 荃灣 縉皇居 OceanPointeToTsuenWan.jpg",
        "屋苑 邨巴 縉皇居 荃灣站 TsuenWantoOceanPointe.jpg",
        "KMB 234A 荃灣 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234A/1",
        "KMB 234B 荃灣 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234B/1",
        "KMB 53 荃灣 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/53/1",
        "KMB 234C 觀塘 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234C/1",
        "KMB 234D 觀塘 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234D/1",
        "KMB 261B 九龍站 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/261B/1",
        "KMB 48P 火炭 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/48P/1",
        "KMB 52P 旺角 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52P/1",
        "GMB 96C 荃灣 碧堤半島 https://data.etagmb.gov.hk/eta/route-stop/2008093/2/1",
        "KMB 52X 旺角 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52X/1",
        "CTB 952 銅鑼灣 海韻花園 https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/002618/952",
        "KMB A38 機場 深井深慈街 https://data.etabus.gov.hk/v1/transport/kmb/eta/5A2A66038B409879/A38/1",
        "KMB 52X 屯門 碧堤半島 https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/52X/1",
        "KMB 53 元朗 碧堤半島 https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/53/1",
        "CTB 952 屯門 碧堤半島 https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/002619/952"
    ];

    // Preloaded hardcoded backup schedule arrays extracted from image files if dynamic canvas parsing is constrained
    // Column format: [Mon-Fri array], [Sat array], [Sun/Holiday array]
    const fallbackSchedules = {
        "OceanPointeToTsuenWan.jpg": {
            colIndex: 0,
            schedules: [
                ["06:30","06:50","07:10","07:20","07:30","07:40","07:50","08:00","08:10","08:20","08:30","08:50","09:10","09:30","09:50","10:10","10:30","10:50","11:10","11:30","11:50","12:10","12:30","12:50","13:30","14:50","15:30","15:50","16:10","16:30","16:50","17:10","17:30","17:50","18:10","18:30","18:50","19:10","19:30","19:50"],
                ["06:30","06:50","07:10","07:30","07:50","08:10","08:30","08:50","09:10","09:30","09:50","10:10","10:30","10:50","11:10","11:30","11:50","12:10","12:30","12:50","13:30","14:50","15:30","15:50","16:10","16:30","16:50","17:10","17:30","17:50","18:10","18:30","18:50","19:10","19:30"],
                ["06:50","07:35","08:20","09:05","09:50","10:35","11:20","12:05","12:50","14:50","15:35","16:20","17:05","17:50","18:35","19:20"]
            ]
        },
        "TsuenWantoOceanPointe.jpg": {
            colIndex: 0,
            schedules: [
                ["06:45","07:05","07:25","07:45","08:05","08:25","08:45","09:05","09:25","09:45","10:05","10:25","10:45","11:05","11:25","11:45","12:05","12:25","12:45","13:05","13:45","15:05","15:45","16:05","16:25","16:45","17:05","17:25","17:45","18:05","18:25","18:45","19:05","19:25","19:45","20:05"],
                ["06:45","07:05","07:25","07:45","08:05","08:25","08:45","09:05","09:25","09:45","10:05","10:25","10:45","11:05","11:25","11:45","12:05","12:25","12:45","13:05","13:45","15:05","15:45","16:05","16:25","16:45","17:05","17:25","17:45","18:05","18:25","18:45","19:05","19:25","19:45"],
                ["07:05","07:50","08:35","09:20","10:05","10:50","11:35","12:20","13:05","15:05","15:50","16:35","17:20","18:05","18:50","19:35"]
            ]
        }
    };

    // Helper to get current time in HK Timezone (GMT+8)
    function getHKNow() {
        const now = new Date();
        // Format to HK string representation
        const hkString = now.toLocaleString("en-US", { timeZone: "Asia/Hong_Kong" });
        return new Date(hkString);
    }

    // Fetch and parse HK Government Public Holidays dynamically for the current year
    async function loadPublicHolidays() {
        const year = getHKNow().getFullYear();
        try {
            const response = await fetch(`https://www.1823.gov.hk/common/ical/en.ics`);
            if (!response.ok) return;
            const text = await response.text();
            
            // Simple parsing of iCal format for DATE strings (DTSTART;VALUE=DATE:YYYYMMDD)
            const matches = text.matchAll(/DTSTART(?:;VALUE=DATE)?:(\d{8})/g);
            for (const match of matches) {
                const dateStr = match[1];
                if (dateStr.startsWith(year.toString())) {
                    publicHolidays.add(dateStr); // format YYYYMMDD
                }
            }
        } catch (e) {
            console.warn("Could not fetch official public holidays dynamically, falling back to standard weekend checks.", e);
        }
    }

    // Determine schedule column: 0 = Mon-Fri, 1 = Sat, 2 = Sun/Public Holiday
    function getDayColumnIndex(now) {
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateKey = `${year}${month}${day}`;

        const dayOfWeek = now.getDay(); // 0 is Sunday, 6 is Saturday

        if (dayOfWeek === 0 || publicHolidays.has(dateKey)) {
            return 2; // Sunday or Public Holiday
        } else if (dayOfWeek === 6) {
            return 1; // Saturday
        } else {
            return 0; // Monday to Friday
        }
    }

    // Calculate next 3 ETAs from a static time array based on current HK time
    function getStaticSchedulesETAs(filename, now) {
        const config = fallbackSchedules[filename];
        if (!config) return [];

        const colIdx = getDayColumnIndex(now);
        const times = config.schedules[colIdx] || [];

        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        const currentSecs = now.getSeconds();
        const totalCurrentSecs = currentMinutes * 60 + currentSecs;

        let futureEtas = [];
        for (let tStr of times) {
            const [hh, mm] = tStr.split(':').map(Number);
            const tTotalSecs = (hh * 60 + mm) * 60;
            const diffSecs = tTotalSecs - totalCurrentSecs;
            if (diffSecs >= 0) {
                // Round up or down to nearest minute
                futureEtas.push(Math.round(diffSecs / 60));
            }
            if (futureEtas.length >= 3) break;
        }
        return futureEtas;
    }

    // Fetch API endpoint and return next 3 ETA differences in minutes
    async function fetchApiEtas(url, now) {
        try {
            const response = await fetch(url);
            if (!response.ok) return [];
            const json = await response.json();
            
            let etaList = [];
            if (json.data && Array.isArray(json.data)) {
                etaList = json.data;
            } else if (Array.isArray(json)) {
                etaList = json;
            }

            let results = [];
            for (let item of etaList) {
                const etaTimeStr = item.eta || item.ETATime || item.est_time;
                if (!etaTimeStr) continue;

                const etaDate = new Date(etaTimeStr);
                if (isNaN(etaDate.getTime())) continue;

                const diffMs = etaDate - now;
                const diffMins = Math.round(diffMs / 60000);

                if (diffMins >= 0) {
                    results.push(diffMins);
                }
                if (results.length >= 3) break;
            }
            return results;
        } catch (err) {
            // Handle exceptions/offline/expired routes gracefully
            return [];
        }
    }

    // Render badge HTML based on minute value
    function renderEtaBadge(val) {
        if (val === undefined || val === null || isNaN(val)) {
            return `<span class="eta-badge eta-none">-</span>`;
        }
        let colorClass = "eta-green";
        if (val < 9) {
            colorClass = "eta-red";
        } else if (val >= 9 && val < 15) {
            colorClass = "eta-orange";
        }
        return `<span class="eta-badge ${colorClass}">${val}</span>`;
    }

    // Main update loop
    async function updateBusData() {
        const now = getHKNow();
        
        // Format current date display
        const options = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        const dateTimeString = now.toLocaleDateString('en-GB', options).replace(/,/g, '');
        document.getElementById('current-time').innerText = dateTimeString;

        let tableHtml = '';

        for (let line of busInstructions) {
            const parts = line.trim().split(/\s+/);
            if (parts.length < 4) continue;

            const busCoId = parts[0];
            const route = parts[1];
            const direction = parts[2];
            const stopName = parts[3];
            const apiOrFile = parts.slice(4).join(' ');

            let etas = [];

            if (!apiOrFile.startsWith("https://")) {
                // Static image file schedule lookup
                etas = getStaticSchedulesETAs(apiOrFile, now);
            } else {
                // Live web API call
                etas = await fetchApiEtas(apiOrFile, now);
            }

            // Skip route if no more buses for the day
            if (etas.length === 0) {
                continue;
            }

            let etaBadgesHtml = '';
            for (let i = 0; i < 3; i++) {
                etaBadgesHtml += renderEtaBadge(etas[i]);
            }

            tableHtml += `
                <tr>
                    <td>${direction}</td>
                    <td><span class="route-badge">${route}</span></td>
                    <td>${stopName}</td>
                    <td>${etaBadgesHtml}</td>
                </tr>
            `;
        }

        document.getElementById('eta-table-body').innerHTML = tableHtml;
    }

    // Initialize and run auto-refresh every 10 seconds silently
    window.addEventListener('load', async () => {
        await loadPublicHolidays();
        updateBusData();
        setInterval(updateBusData, 10000);
    });
</script>
 
</body>
</html>
